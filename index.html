<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in to Hydra</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050506">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23111' stroke='%23e84854' stroke-width='3'/%3E%3Cpath d='M16 7l8 15h-4l-4-8-4 8H8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <div class="banner"><span>// TEST BUILD - NOT FINAL VERSION - REPORT ALL BUGS TO @ALAC_JKL //</span><i class="l" id="x1">&times;</i><i class="r" id="x2">&times;</i></div>
  <div class="main">
    <aside>
      <div class="brand"><span class="mark"></span>Hydra</div>
      <div class="form">
        <h1>Sign in to Hydra</h1>
        <p class="sub">Enter your Roblox username and today's access key.</p>
        <form id="f" autocomplete="off">
          <label for="u">Roblox username</label>
          <input id="u" name="username" maxlength="20" required autocapitalize="off" spellcheck="false">
          <label for="k">Access key</label>
          <input id="k" name="key" class="mono" type="password" maxlength="40" required autocapitalize="characters" spellcheck="false" placeholder="HYD-XXX-XXXX-XXXX-XXXX">
          <button id="go" type="submit">Sign in</button>
          <p class="note" id="note" role="alert" hidden></p>
        </form>
      </div>
    </aside>
    <div class="stage" id="stage"><canvas id="c" aria-label="Rotating ASCII coin showing division emblems"></canvas><div class="tag" id="tag"></div></div>
  </div>
</div>
<script src="/faces.js"></script>
<script src="/app.js"></script>
<script src="/login.js"></script>
</body>
</html>
