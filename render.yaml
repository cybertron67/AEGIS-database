# Render Blueprint: New > Blueprint > pick this repo. Needs a paid instance because
# free web services can't keep a disk, and your database + images live on a disk.
services:
  - type: web
    name: hydra
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: hydra-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false          # Render will ask you for this when you deploy
      - key: KEY_TZ
        value: UTC
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
